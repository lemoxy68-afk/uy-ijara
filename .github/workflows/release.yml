name: Release AAB
on: workflow_dispatch
jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: minSdkVersion 24
        run: sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
      - run: npx cap sync android
      - name: versionCode (har build'da oshadi)
        run: |
          sed -i -E "s/versionCode[ =]+1\b/versionCode = ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          grep -n "SdkVersion" android/variables.gradle
      - run: cd android && chmod +x gradlew && ./gradlew bundleRelease
      - uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: uyijara-aab
          path: ${{ steps.sign.outputs.signedReleaseFile }}
